<body>
<section class="shipping-section">
    <h2>Cotizar Envío</h2>
    
    <form id="shippingForm">
        <div class="form-group">
            <label for="nombre">Nombre Completo</label>
            <input type="text" id="nombre" required placeholder="Ej. Juan Pérez">
        </div>

        <div class="form-group">
            <label for="direccion">Dirección de Entrega</label>
            <input type="text" id="direccion" required placeholder="Calle, Número, Depto">
        </div>

        <div class="form-group">
            <label for="codigoPostal">Código Postal</label>
            <input type="text" id="codigoPostal" required placeholder="Ej. 1425">
        </div>

        <div class="form-group">
            <label for="tipoEnvio">Tipo de Servicio</label>
            <select id="tipoEnvio">
                <option value="estandar">Estándar (3 a 5 días hábiles)</option>
                <option value="express">Express (24 a 48 horas)</option>
            </select>
        </div>

        <button type="submit" class="btn-submit">Calcular Costo</button>
    </form>

    <div id="resultCard" class="result-card" style="display: none;">
        <h3>¡Cotización Lista, <span id="resNombre"></span>!</h3>
        <p>Costo de envío: $<span id="resMonto"></span></p>
    </div>
    

</section>
