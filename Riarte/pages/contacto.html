<body>
    <header class="navbar">

        <a href="carrito.html" class="carrito-link">
            <img src="../images/carlog.webp" alt="carrito" class="carrito-img">
            <span class="carrito-contador" id="carrito-contador"></span>
        </a>
    </header>
    <main>
        <section class="contacto-hero">
            <h2>Contacto</h2>
            <p>Completá el formulario y nos comunicamos a la brevedad.</p>
        </section>

        <section class="contacto-form-wrapper">
            <form class="contacto-form" action="#" method="POST">
                <div class="form-group">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Juan Pérez" required>
                </div>
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="juan@mail.com" required>
                </div>
                <div class ="form-group">
                    <label for="telefono">Numero de telefono</label>
                    <input type="telefono" id="telefono" name="telefono" placeholder="11-9999-9999" required>
                </div>
                <div class="form-group">
                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" rows="6" placeholder="Escribí tu consulta acá..." required></textarea>
                </div>
                <button type="submit" class="contacto-btn">Enviar mensaje</button>



            </form>

        </section>

    </main>
