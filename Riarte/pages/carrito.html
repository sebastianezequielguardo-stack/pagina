<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas El Cóndor - Carrito</title>
    <link rel="stylesheet" href="../css/estilos.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/navegador.css">
    <link rel="stylesheet" href="../css/carrito.css">
</head>

<body>

    <header class="navbar">
        <a href="../index.html">
            <img src="../images/logo.webp" alt="Logo" class="logo-img">
        </a>

        <nav class="navegador">
            <ul>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>

        <a href="carrito.html" class="carrito-link">
            <img src="../images/carlog.webp" alt="carrito" class="carrito-img">
            <span class="carrito-contador" id="carrito-contador"></span>
        </a>
    </header>

    <main>
        <section class="carrito-hero">
            <h2>Tu carrito</h2>
        </section>

        <div class="carrito-layout">

            <!-- LISTA DE PRODUCTOS -->
            <div class="carrito-items">
                <div class="carrito-vacio" id="carrito-vacio">
                    <p>Tu carrito está vacío.</p>
                    <a href="productos.html" class="btn-ver-productos">Ver productos</a>
                </div>

                <!-- Los productos se van a insertar acá con JS -->
                <div id="lista-productos"></div>
            </div>

            <!-- RESUMEN DE COMPRA -->
            <aside class="carrito-resumen">
                <h3 class="resumen-titulo">Resumen de compra</h3>

                <div class="resumen-fila">
                    <span>Producto</span>
                    <span id="resumen-subtotal">$0</span>
                </div>

                <div class="resumen-divisor"></div>

                <div class="resumen-fila resumen-total">
                    <span>Total</span>
                    <span id="resumen-total">$0</span>
                </div>

                <button class="btn-comprar" id="btn-finalizar">Finalizar compra</button>
            </aside>

        </div>
    </main>

   <footer>


             <p>&copy; 2026 Tablas El Cóndor</p>



       

        <div class="footer-grid">

            <div class="footer-brand">
                <h4>Condorito</h4>
                <p>>De la naturaleza a tu mesada..</p>
            </div>
            
            <div>
                <h5>Explorar</h5>
                <ul>
                    <li><a href="../index.html">Inicio</a></li>
                    <li><a href="productos.html">Productos</a></li>
                    <li><a href="nosotros.html">Nosotros</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
            </div>

            <div>
                <h5>Seguinos</h5>
                <ul>
                    <li><a href="https://www.instagram.com/tablaselcondor?igsh=Z2ZkdjkxanBiOWhl" target="_blank"><img src="../images/instagram.webp" alt="Instagram" class="instagram-logo"></a></li>
                    <li><a href="https://www.facebook.com/share/19QZ3HHV6k/" target="_blank"><img src="../images/facebook.webp" alt="Facebook" class="facebook-logo"></a></li>
                    <li><a href="https://wa.me/TU_NUMERO_WHATSAPP" target="_blank"><img src="../images/whatsapp.webp" alt="WhatsApp" class="whatsapp-logo"></a></li>
                </ul>
            </div>
        </div>

    </footer>

    <script src="../js/carrito.js"></script>
    <script src="../js/script.js"></script>
</body>
</html>
